<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner de Billets - Analyse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: #1c1814;
      color: #ede8df;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      text-align: center;
      color: #d4a84b;
    }

    .scanner-box {
      background: rgba(28, 24, 20, 0.9);
      border: 1px solid rgba(212, 168, 75, 0.3);
      border-radius: 8px;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .upload-area {
      border: 2px dashed rgba(212, 168, 75, 0.5);
      border-radius: 8px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
    }

    .upload-area:hover {
      border-color: #d4a84b;
      background: rgba(212, 168, 75, 0.05);
    }

    .upload-area.dragover {
      border-color: #d4a84b;
      background: rgba(212, 168, 75, 0.1);
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.6;
    }

    .upload-text {
      font-size: 0.9rem;
      color: #8a7b6e;
      margin-bottom: 0.5rem;
    }

    .upload-hint {
      font-size: 0.7rem;
      color: #8a7b6e;
      opacity: 0.6;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      justify-content: center;
      padding: 1rem 2rem;
      border: 1px solid #d4a84b;
      background: transparent;
      color: #d4a84b;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #d4a84b;
      color: #1c1814;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .preview-container {
      margin-top: 2rem;
      display: none;
    }

    .preview-container.show {
      display: block;
    }

    .preview-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(212, 168, 75, 0.2);
      margin-bottom: 1rem;
    }

    .result-box {
      background: rgba(212, 168, 75, 0.08);
      border-left: 3px solid #d4a84b;
      padding: 1.5rem;
      border-radius: 4px;
      margin-top: 1.5rem;
      display: none;
    }

    .result-box.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-title {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #d4a84b;
      margin-bottom: 0.5rem;
    }

    .result-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #ede8df;
      margin-bottom: 0.5rem;
    }

    .result-label {
      font-size: 0.75rem;
      color: #8a7b6e;
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(212, 168, 75, 0.1);
    }

    .result-label:last-child {
      border-bottom: none;
    }

    .alert {
      border-left-color: #ff4444;
    }

    .alert .result-title {
      color: #ff4444;
    }

    .success {
      border-left-color: #3a6e00;
    }

    .success .result-title {
      color: #3a6e00;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212, 168, 75, 0.2);
      border-top-color: #d4a84b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      color: #8a7b6e;
      text-decoration: none;
      font-size: 0.8rem;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #d4a84b;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .scanner-box {
        padding: 1.5rem;
      }

      .upload-area {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SCANNER DE BILLETS</h1>

    <div class="scanner-box">
      <form id="scanForm" enctype="multipart/form-data">
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📸</div>
          <div class="upload-text">Glissez-déposez une image de billet</div>
          <div class="upload-hint">ou cliquez pour sélectionner</div>
          <input type="file" id="fileInput" name="capture" accept="image/*" required>
        </div>

        <button type="submit" class="btn" id="scanBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 12z"/>
            <path d="M21 3v6h-6"/>
          </svg>
          Analyser le billet
        </button>
      </form>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="upload-text">Analyse en cours...</div>
      </div>

      <div class="preview-container" id="previewContainer">
        <img id="previewImage" class="preview-image" src="" alt="Aperçu du billet">
      </div>

      <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle">Résultat de l'analyse</div>
        <div class="result-text" id="resultText"></div>
        <div class="result-label">
          <span>Fiabilité:</span>
          <span id="reliability"></span>
        </div>
        <div class="result-label">
          <span>Texture du papier:</span>
          <span id="paperTexture"></span>
        </div>
        <div class="result-label">
          <span>Fil de sécurité:</span>
          <span id="securityThread"></span>
        </div>
        <div class="result-label">
          <span>Encre optique:</span>
          <span id="opticalInk"></span>
        </div>
        <div class="result-label">
          <span>Date:</span>
          <span id="timestamp"></span>
        </div>
      </div>

      <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Retour à l'accueil
      </a>
    </div>
  </div>

  <script>
    const form = document.getElementById('scanForm');
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const scanBtn = document.getElementById('scanBtn');
    const loading = document.getElementById('loading');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const resultBox = document.getElementById('resultBox');

    // Gestion du glisser-déposer et clic
    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        handleFileSelect(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    function handleFileSelect(file) {
      if (!file.type.startsWith('image/')) {
        alert('Veuillez sélectionner une image');
        return;
      }

      scanBtn.disabled = false;
      previewImage.src = URL.createObjectURL(file);
      previewContainer.classList.add('show');
      resultBox.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('capture', fileInput.files[0]);

      loading.classList.add('show');
      scanBtn.disabled = true;
      resultBox.classList.remove('show');

      try {
        const response = await fetch('/api/scan-billet', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        loading.classList.remove('show');

        if (data.success) {
          displayResult(data);
        } else {
          alert('Erreur lors de l\'analyse: ' + (data.error || 'Erreur inconnue'));
        }
      } catch (error) {
        loading.classList.remove('show');
        alert('Erreur de connexion au serveur');
        console.error(error);
      } finally {
        scanBtn.disabled = false;
      }
    });

    function displayResult(data) {
      const analysis = data.analyse;
      const criteria = data.criteres_verifies;

      // Titre et classe selon l'alerte
      const resultTitle = document.getElementById('resultTitle');
      const resultText = document.getElementById('resultText');

      resultText.textContent = analysis.resultat;

      if (analysis.alerte_securite) {
        resultBox.className = 'result-box show alert';
        resultTitle.textContent = '⚠️ ATTENTION';
      } else {
        resultBox.className = 'result-box show success';
        resultTitle.textContent = '✓ BILLET VALIDÉ';
      }

      // Détails
      document.getElementById('reliability').textContent = analysis.fiabilite;
      document.getElementById('paperTexture').textContent = criteria.texture_papier;
      document.getElementById('securityThread').textContent = criteria.fil_securite;
      document.getElementById('opticalInk').textContent = criteria.encre_optique;
      document.getElementById('timestamp').textContent = analysis.timestamp;

      // Message
      if (analysis.alerte_securite) {
        resultText.textContent = analysis.message + ' ' + analysis.resultat;
      } else {
        resultText.textContent = analysis.message;
      }
    }
  </script>

</body>
</html>
